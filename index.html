async function gerarDocxReal(d) {
  if(!d.tipoImovel || !d.genero) {
    alert('Selecione o tipo de imóvel e o tratamento!');
    return null;
  }

  const chave = `${d.genero}-${d.tipoImovel}`;
  const url = TEMPLATE_URLS[chave];

  if(!url) {
    alert('Template não encontrado para: ' + chave);
    return null;
  }

  try {
    const response = await fetch(url);
    if(!response.ok) throw new Error('Falha ao baixar template');
    const arrayBuffer = await response.arrayBuffer();

    const zip = await JSZip.loadAsync(arrayBuffer);
    let xml = await zip.file('word/document.xml').async('string');

    // Preparar dados para casal
    const isCasal = d.genero === 'plural';
    const nome1 = d.nome || '_____________';
    const nome2 = d.nome2 || '_____________';
    const cpf1 = d.cpf || '___.___.___-__';
    const cpf2 = d.cpf2 || '___.___.___-__';
    const rg1 = d.rg || '_____________';
    const rg2 = d.rg2 || '_____________';

    // Substituições nos placeholders do template
    const subs = [
      ['{NOME}', nome1.toUpperCase()],
      ['{NOME1}', nome1.toUpperCase()],
      ['{NOME2}', nome2.toUpperCase()],
      ['{NACIONALIDADE}', d.nacionalidade || 'brasileiro(a)'],
      ['{NACIONALIDADE1}', d.nacionalidade || 'brasileiro'],
      ['{NACIONALIDADE2}', d.nacionalidade2 || 'brasileira'],
      ['{PROFISSAO}', d.profissao || '_____________'],
      ['{PROFISSAO1}', d.profissao || '_____________'],
      ['{PROFISSAO2}', d.profissao2 || '_____________'],
      ['{RG}', rg1 + '-' + (d.orgaoEmissor || 'SSP') + '/' + (d.rgUF || 'PR')],
      ['{RG1}', rg1 + '-' + (d.orgaoEmissor || 'SSP') + '/' + (d.rgUF || 'PR')],
      ['{RG2}', rg2 + '-' + (d.orgaoEmissor2 || 'SSP') + '/' + (d.rgUF2 || 'PR')],
      ['{CPF}', cpf1],
      ['{CPF1}', cpf1],
      ['{CPF2}', cpf2],
      ['{ENDERECO}', d.endereco || '_____________'],
      ['{CIDADE}', d.cidade || 'Mamborê/PR'],
      ['{CEP}', d.cep || '87340-000'],
      ['{EMAIL}', d.email || 'declara não possuir'],
      ['{TELEFONE}', d.telefone || '(__)_____-____'],
      ['{DATA_TERRAS_N}', d.dataTerraN || '___'],
      ['{DATA_TERRAS_EXTENSO}', d.dataTerraNExtenso || '_____________'],
      ['{QUADRA_N}', d.quadraN || '___'],
      ['{QUADRA_EXTENSO}', d.quadraNExtenso || '_____________'],
      ['{AREA_M2}', d.areaM2 || '_____'],
      ['{ENDERECO_IMOVEL}', d.enderecoImovel || '_____________'],
      ['{CIDADE_IMOVEL}', d.cidadeImovel || 'Mamborê/PR'],
      ['{MATRICULA}', d.matricula || '___'],
      ['{LIVRO}', d.livro || '___'],
      ['{VALOR_VENDA}', d.valorVenda || '_____________'],
      ['{VALOR_EXTENSO}', d.valorVendaExtenso || '_____________'],
      ['{VIGENCIA_MESES}', d.vigenciaMeses || '12'],
      ['{VIGENCIA_EXTENSO}', d.vigenciaMesesExtenso || 'doze'],
      ['{COMISSAO_PERCENT}', d.comissaoPercent || '5'],
      ['{COMISSAO_EXTENSO}', d.comissaoPercentExtenso || 'cinco por cento'],
      ['{DATA_CONTRATO}', d.dataContrato || '______ de __________________ de ________'],
      ['{TESTEMUNHA_NOME}', d.testemunhaNome || '_________________________'],
      ['{TESTEMUNHA_CPF}', d.testemunhaCPF || '___.___.___-__'],
    ];

    // Aplicar substituições
    for(const [placeholder, valor] of subs) {
      xml = xml.split(placeholder).join(valor);
    }

    // Salvar XML modificado
    zip.file('word/document.xml', xml);

    // Gerar blob final
    return await zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });

  } catch(error) {
    console.error('Erro ao gerar documento:', error);
    alert('Erro ao gerar contrato: ' + error.message);
    return null;
  }
}

function gerarPreviewTexto(d){
  const f=d.genero==='feminino';
  const hasSpouse=(d.estadoCivil==='casado(a)'||d.estadoCivil==='união estável');
  const items=[
    ['Nome',d.nome],['Gênero',d.genero==='feminino'?'Feminino (A Contratante)':d.genero==='masculino'?'Masculino (O Contratante)':'Plural (Os Contratantes)'],
    ['Nacionalidade',d.nacionalidade],['Profissão',d.profissao],
    ['Portador(a)',d.portadorGenero],
    ['RG',d.rg?(d.rg+'-'+(d.orgaoEmissor||'SSP')+'/'+(d.rgUF||'PR')):d.rg],
    ['CPF',d.cpf],['Estado Civil',d.estadoCivil],
    ...(hasSpouse?[
      ['Regime de Casamento',d.regimeCasamento],['Data do Casamento',d.dataCasamento],
      ['Nome do Cônjuge',d.nomeConjuge],['Nacionalidade Cônjuge',d.nacionalidadeConjuge],
      ['Profissão Cônjuge',d.profissaoConjuge],['Portador(a) Cônjuge',d.portadorGeneroConjuge],
      ['RG Cônjuge',d.rgConjuge?(d.rgConjuge+'-'+(d.orgaoEmissorConjuge||'SSP')+'/'+(d.rgUFConjuge||'PR')):d.rgConjuge],
      ['CPF Cônjuge',d.cpfConjuge]
    ]:[]),
    ['Endereço',d.endereco],['Cidade',d.cidade],['CEP',d.cep],
    ['E-mail',d.email],['Telefone',d.telefone],
    ['','<hr style="margin:10px 0"/>'],
    ['Data de Terras',d.dataTerraN?`nº ${d.dataTerraN} (${d.dataTerraNExtenso})`:''],
    ['Quadra',d.quadraN?`nº ${d.quadraN} (${d.quadraNExtenso})`:''],
    ['Área',d.areaM2?d.areaM2+' m²':''],['Endereço Imóvel',d.enderecoImovel],
    ['Cidade Imóvel',d.cidadeImovel],['Matrícula',d.matricula],['Livro',d.livro],
    ['','<hr style="margin:10px 0"/>'],
    ['Valor',d.valorVenda?`R$ ${d.valorVenda} (${d.valorVendaExtenso})`:''],
    ['Vigência',d.vigenciaMeses?`${d.vigenciaMeses} (${d.vigenciaMesesExtenso}) meses`:''],
    ['Comissão',d.comissaoPercent?`${d.comissaoPercent}% (${d.comissaoPercentExtenso})`:''],
    ['','<hr style="margin:10px 0"/>'],
    ['Testemunha',d.testemunhaNome],['CPF Testemunha',d.testemunhaCPF],
  ];
  return `<div style="font-family:Arial,sans-serif;font-size:10pt;">
    <table style="width:100%;border-collapse:collapse;">
    ${items.map(([l,v])=>l===''?`<tr><td colspan="2">${v}</td></tr>`:
    `<tr style="border-bottom:1px solid #eee;">
      <td style="padding:6px 10px;font-weight:bold;color:#555;width:160px;vertical-align:top;">${l}</td>
      <td style="padding:6px 10px;color:#222;">${v||'<span style="color:#ccc">não preenchido</span>'}</td>
    </tr>`).join('')}
    </table></div>`;
}

  const montarUrlRota=(lista)=>{

    const waypoints=paradas.slice(0,-1);
    let url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino)}&travelmode=driving`;

  const extrairCoordenadas=(texto)=>{
    let m=texto.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
    if(m)return{lat:parseFloat(m[1]),lng:parseFloat(m[2])};
    m=texto.match(/[?&](?:q|ll)=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
    if(m)return{lat:parseFloat(m[1]),lng:parseFloat(m[2])};
    m=texto.match(/^\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);

    const a=document.createElement('a');
    a.href=url;

          <button onClick={async()=>{
              if(!dadosContrato.nome&&!dadosContrato.nome2){
                alert('Por favor, preencha o nome do contratante!');
                return;
              }
              if(!dadosContrato.tipoImovel){
                alert('Por favor, selecione o tipo de imóvel (CASA ou TERRENO)!');
                return;
              }
              const blob=await gerarDocxReal(dadosContrato);
              if(!blob){
                alert('Erro ao gerar documento. Verifique os dados e tente novamente.');
                return;
              }
              // Baixar o arquivo DOCX
              const url=URL.createObjectURL(blob);
              const a=document.createElement('a');
              const nomeArq=(dadosContrato.nome||dadosContrato.nome2||'Contrato').replace(/[^a-zA-ZÀ-ú ]/g,'').replace(/ /g,'_');
              a.href=url;
              a.download=`Contrato_${nomeArq}.docx`;
              a.click();
              URL.revokeObjectURL(url);
              
              // Salvar contrato no Firebase para aparecer em "Em Andamento"
              const hoje=new Date();
              const vigencia=parseInt(dadosContrato.vigenciaMeses)||12;
              const vencimento=new Date(hoje);
              vencimento.setMonth(vencimento.getMonth()+vigencia);
              
              const novoContratoData={
                id:Date.now(),
                cliente:dadosContrato.nome||dadosContrato.nome2||'Cliente',
                imovel:dadosContrato.enderecoImovel||dadosContrato.endereco||'',
                tipo:'Venda',
                valor:dadosContrato.valorVenda||'',
                dataInicio:hoje.toISOString().split('T')[0],
                dataVencimento:vencimento.toISOString().split('T')[0],
                status:'ativo',
                checklist:[false,false,false,false,false,false,false,false,false]
              };
              
              await fsAdd('contratos',novoContratoData);
              
              alert('✅ Contrato gerado com sucesso!\n\nO arquivo Word foi baixado.\nO contrato foi adicionado à lista "Em Andamento" para acompanhamento.\n\nPara converter em PDF:\n1. Abra o arquivo no Word\n2. Arquivo → Salvar como → PDF');
              setShowGerador(false);
            }} className={`flex items-center gap-2 ${btnGrad}`}><Icons.FileText/>Gerar e Baixar Contrato</button>

            {novoContrato.imagemUrl?(
              <img src={novoContrato.imagemUrl} className="w-20 h-20 object-cover rounded-xl border-2 border-gray-200"/>
            ):(
              <div className="w-20 h-20 bg-gray-100 rounded-xl flex items-center justify-center border-2 border-gray-200"><Icons.Home className="w-10 h-10 text-gray-400"/></div>
            )}
            <div className="flex flex-col gap-2">
              <label className="px-4 py-2 bg-blue-500 text-white rounded-lg cursor-pointer hover:bg-blue-600 text-sm font-medium text-center">
                Escolher Imagem
                <input type="file" accept="image/*" className="hidden" onChange={(e)=>{
                  const file=e.target.files[0];
                  if(file){
                    const reader=new FileReader();
                    reader.onload=(ev)=>setNovoContrato({...novoContrato,imagemUrl:ev.target.result});
                    reader.readAsDataURL(file);
                  }
                }}/>
              </label>
              {novoContrato.imagemUrl&&<button onClick={()=>setNovoContrato({...novoContrato,imagemUrl:''})} className="px-4 py-2 bg-red-100 text-red-600 rounded-lg text-sm font-medium hover:bg-red-200">Remover</button>}
            </div>
          </div>
        </div>
        <div><label className={labelCls}>Cliente *</label><input type="text" value={novoContrato.cliente} onChange={e=>setNovoContrato({...novoContrato,cliente:e.target.value})} placeholder="Nome do cliente" className={inputCls}/></div>
        <div><label className={labelCls}>Código de Referência</label><input type="text" value={novoContrato.codigoRef||''} onChange={e=>setNovoContrato({...novoContrato,codigoRef:e.target.value})} placeholder="Ex: CON-001" className={inputCls}/></div>
        <div><label className={labelCls}>Endereço</label><input type="text" value={novoContrato.endereco||''} onChange={e=>setNovoContrato({...novoContrato,endereco:e.target.value})} placeholder="Ex: Rua Vereador Sidney Barth, nº 1.059" className={inputCls}/></div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label className={labelCls}>Tipo</label><select value={novoContrato.tipo} onChange={e=>setNovoContrato({...novoContrato,tipo:e.target.value})} className={inputCls}><option>Venda</option><option>Locação</option><option>Permuta</option></select></div>
          <div><label className={labelCls}>Valor</label><input type="text" value={novoContrato.valor} onChange={e=>setNovoContrato({...novoContrato,valor:e.target.value})} placeholder="R$ 000,00" className={inputCls}/></div>
        </div>
        <div><label className={labelCls}>Tipo de Imóvel</label><select value={novoContrato.tipoImovel||''} onChange={e=>setNovoContrato({...novoContrato,tipoImovel:e.target.value})} className={inputCls}><option value="">Selecione</option>{TIPOS_IMOVEL.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label className={labelCls}>Data Início</label><input type="date" value={novoContrato.dataInicio} onChange={e=>setNovoContrato({...novoContrato,dataInicio:e.target.value})} className={inputCls}/></div>
          <div><label className={labelCls}>Vencimento</label><input type="date" value={novoContrato.dataVencimento} onChange={e=>setNovoContrato({...novoContrato,dataVencimento:e.target.value})} className={inputCls}/></div>
        </div>
        <div><label className={labelCls}>Status</label><select value={novoContrato.status} onChange={e=>setNovoContrato({...novoContrato,status:e.target.value})} className={inputCls}><option value="ativo">Ativo</option><option value="encerrado">Encerrado</option></select></div>
      </div>
      <div className="flex gap-3 p-5 border-t border-gray-200"><button onClick={()=>setShowContratoModal(false)} className="flex-1 px-5 py-3 bg-gray-100 text-gray-600 rounded-xl font-medium hover:bg-gray-200">Cancelar</button><button onClick={handleAddContrato} className={`flex-1 ${btnGrad}`}>{editingContrato?'Salvar':'Adicionar'}</button></div>
    </div></div>}

    {showFichaModal&&<div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 overflow-y-auto"><div className="bg-white rounded-2xl w-full max-w-lg shadow-2xl my-auto max-h-[90vh] flex flex-col">
      <div className="flex items-center justify-between p-5 border-b border-gray-200"><h2 className="text-xl font-bold text-gray-800">Gerar Ficha de Visita</h2><button onClick={()=>setShowFichaModal(false)} className="p-2 hover:bg-gray-100 rounded-lg text-gray-500"><Icons.X/></button></div>
      <div className="p-5 border-b border-gray-200">
        <input type="text" placeholder="Buscar por referência ou endereço..." value={fichaBusca} onChange={e=>setFichaBusca(e.target.value)} className={inputCls}/>
        <p className="text-xs text-gray-500 mt-2">{fichaSelecionados.length} imóvel(is) selecionado(s)</p>
      </div>
      <div className="p-5 overflow-y-auto flex-1 space-y-2">
        {fichaCarregando&&<p className="text-center text-gray-400 py-8">Buscando imóveis no site público...</p>}
        {!fichaCarregando&&fichaImoveis.filter(p=>{
          if(!fichaBusca)return true;
          const b=fichaBusca.toLowerCase();
          return p.reference.toLowerCase().includes(b)||p.endereco.toLowerCase().includes(b);
        }).map(p=>(
          <label key={p.id} className="flex items-start gap-3 p-3 border border-gray-200 rounded-xl hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" checked={fichaSelecionados.includes(p.reference)} onChange={()=>toggleFichaSelecionado(p.reference)} className="mt-1"/>
            <div>
              <p className="font-semibold text-gray-800 text-sm">REF {p.reference} — {p.endereco||'—'}</p>
              <p className="text-xs text-gray-500">{montarMetragem(p)} · {montarComodos(p)}{p.price?` · R$ ${Number(p.price).toLocaleString('pt-BR')}`:''}</p>
            </div>
          </label>
        ))}
        {!fichaCarregando&&fichaImoveis.length===0&&<p className="text-center text-gray-400 py-8">Nenhum imóvel ativo encontrado no site público.</p>}
      </div>
      <div className="flex gap-3 p-5 border-t border-gray-200"><button onClick={()=>setShowFichaModal(false)} className="flex-1 px-5 py-3 bg-gray-100 text-gray-600 rounded-xl font-medium hover:bg-gray-200">Cancelar</button><button onClick={gerarFichaVisitaPDF} className={`flex-1 ${btnGrad}`}>Gerar PDF ({fichaSelecionados.length})</button></div>
    </div></div>}

    <footer className="py-6 border-t border-gray-200 bg-white no-print"><p className="text-center text-gray-500 text-sm">© 2026 G4 Investimóveis - Sistema de Gestão</p></footer>
  </div>);
}
ReactDOM.render(<G4Investimoveis/>,document.getElementById('root'));
</script>
</body>
</html>
